<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iOS Photos Premium</title>

<style>

/* ===== RESET ===== */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui;
-webkit-tap-highlight-color:transparent;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* ===== LOCK ===== */
body.lock{
overflow:hidden;
height:100vh;
pointer-events:none;
}

body.unlock{
pointer-events:auto;
}

/* ===== BG VIDEO ===== */
.bg-video{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-3;
}

.dark{
position:fixed;
inset:0;
background:rgba(0,0,0,0.55);
z-index:-2;
}

/* ===== PARTICLES ===== */
#particles{
position:fixed;
inset:0;
z-index:-1;
pointer-events:none;
}

/* ===== POPUP ===== */
.tutorial-popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0.85);

width:340px;
height:270px;

background:rgba(25,25,25,0.96);
backdrop-filter:blur(20px);

border-radius:28px;

opacity:0;
transition:0.3s ease;

z-index:999999;
pointer-events:auto;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:16px;

box-shadow:
0 25px 80px rgba(0,0,0,0.75);
}

.tutorial-popup.show{
opacity:1;
transform:translate(-50%,-50%) scale(1);
}

.tutorial-popup p{
font-size:14px;
text-align:center;
opacity:0.85;
padding:0 20px;
line-height:1.6;
}

.tutorial-popup button{
padding:12px 18px;
border:none;
border-radius:14px;
background:white;
font-weight:800;
cursor:pointer;
}

/* ===== HERO ===== */
.hero{
padding:65px 20px 14px;
text-align:center;
position:relative;
z-index:2;
overflow:hidden;
}

/* ===== PREMIUM BLACK METALLIC TITLE ===== */
.hero h1{
position:relative;

font-size:42px;
font-weight:1000;

letter-spacing:1px;
line-height:1.1;

/* METALLIC BLACK-WHITE */
background:
linear-gradient(
90deg,
#ffffff 0%,
#d9d9d9 18%,
#7a7a7a 35%,
#ffffff 50%,
#3a3a3a 68%,
#d0d0d0 82%,
#ffffff 100%
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

/* DARK DEPTH */
text-shadow:
0 2px 8px rgba(0,0,0,0.45),
0 0 18px rgba(255,255,255,0.04);

/* SMOOTH MOTION */
animation:
titleGlow 4s ease-in-out infinite;

transform:translateZ(0);
}

/* ===== SHINE EFFECT ===== */
.hero h1::after{
content:"";

position:absolute;
top:0;
left:-120%;

width:60%;
height:100%;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,0.18),
transparent
);

transform:skewX(-20deg);

animation:shine 4.5s linear infinite;
}

/* ===== BRIGHTNESS PULSE ===== */
@keyframes titleGlow{

0%{
filter:brightness(0.92);
}

50%{
filter:brightness(1.18);
}

100%{
filter:brightness(0.92);
}

}

/* ===== SHINE MOVE ===== */
@keyframes shine{

0%{
left:-120%;
}

100%{
left:150%;
}

}

/* ===== GRID ===== */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
padding:14px;
position:relative;
z-index:2;
}

.grid img{
width:100%;
height:230px;
object-fit:cover;
border-radius:18px;
cursor:pointer;

transition:0.25s ease;
}

.grid img:active{
transform:scale(0.96);
}

/* ===== VIEWER ===== */
.viewer{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
z-index:999999;

background:rgba(0,0,0,0.45);

backdrop-filter:blur(0px);

transition:0.25s ease;
}

.viewer.active{
display:flex;
backdrop-filter:blur(18px);
}

.viewer-box{
display:flex;
flex-direction:column;
align-items:center;
gap:14px;
}

/* FOTO */
.viewer img{
max-width:92%;
max-height:70vh;

border-radius:20px;

opacity:0;
transform:translateY(-120px) scale(0.9);

transition:
transform 0.38s cubic-bezier(.2,.9,.2,1),
opacity 0.35s ease;
}

.viewer.show img{
opacity:1;
transform:translateY(0) scale(1);
}

/* DOWNLOAD BUTTON */
.download-btn{
padding:10px 16px;
border:none;
border-radius:14px;

background:rgba(255,255,255,0.95);

backdrop-filter:blur(10px);

font-weight:800;
cursor:pointer;

opacity:0;
transform:translateY(40px) scale(0.9);

transition:
transform 0.4s cubic-bezier(.2,.9,.2,1),
opacity 0.35s ease;

transition-delay:0.12s;

box-shadow:
0 8px 25px rgba(0,0,0,0.25);
}

.viewer.show .download-btn{
opacity:1;
transform:translateY(0) scale(1);
}

.download-btn:active{
transform:scale(0.95);
}

/* ===== MUSIC BAR ===== */
.music{
position:fixed;
bottom:18px;
left:50%;
transform:translateX(-50%);

width:88%;
max-width:360px;

display:flex;
align-items:center;
gap:12px;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(18px);

padding:12px 14px;

border-radius:22px;

z-index:99999;

box-shadow:
0 10px 35px rgba(0,0,0,0.35);
}

/* PLAY BUTTON */
.music button{
width:46px;
height:46px;

border-radius:50%;
border:none;

background:white;

font-weight:900;
cursor:pointer;

flex-shrink:0;

transition:0.2s ease;
}

.music button:active{
transform:scale(0.92);
}

/* INFO */
.music-info{
flex:1;
overflow:hidden;
}

/* MARQUEE */
.marquee{
width:100%;
overflow:hidden;
white-space:nowrap;
position:relative;
}

/* TEXT BERJALAN */
.marquee span{
display:inline-block;
padding-left:100%;

animation:marquee 11s linear infinite;

font-size:14px;
font-weight:700;
}

/* SUB */
.sub{
font-size:11px;
opacity:0.6;
margin-top:2px;
}

/* MARQUEE ANIMATION */
@keyframes marquee{
0%{
transform:translateX(0);
}
100%{
transform:translateX(-100%);
}
}

</style>
</head>

<body class="lock">

<!-- BG VIDEO -->
<video class="bg-video" autoplay muted loop playsinline>
<source src="https://res.cloudinary.com/dlzivwcxc/video/upload/v1778620808/bg_ourtb1.mp4">
</video>

<div class="dark"></div>

<!-- PARTICLES -->
<canvas id="particles"></canvas>

<!-- POPUP -->
<div class="tutorial-popup" id="tutorialPopup">

<p><b>Tutorial</b></p>

<p>
Klik foto untuk membuka viewer lalu download foto favorit kamu
</p>

<button onclick="closePopup()">
Tutup
</button>

</div>

<!-- HERO -->
<div class="hero">
<h1>BoiBoy Photos</h1>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- VIEWER -->
<div class="viewer" id="viewer" onclick="closeViewer(event)">

<div class="viewer-box">

<img id="img">

<button class="download-btn" id="downloadBtn">
Download
</button>

</div>

</div>

<!-- MUSIC -->
<div class="music">

<button id="btn" onclick="toggleMusic()">▶</button>

<div class="music-info">

<div class="marquee">
<span>
Now Playing • Cinematic Memories • iOS Photos Premium Edition
</span>
</div>

<div class="sub">
Audio Experience
</div>

</div>

</div>

<!-- AUDIO -->
<audio id="audio" loop>
<source src="https://res.cloudinary.com/dlzivwcxc/video/upload/v1778621312/lagu3_szjdw0.mp3">
</audio>

<script>

/* ===== MUSIC STATE ===== */
let musicStarted=false;

/* ===== POPUP FLOW ===== */
window.onload=()=>{

document.body.classList.add("lock");

setTimeout(()=>{

document.getElementById("tutorialPopup")
.classList.add("show");

},1000);

};

/* ===== CLOSE POPUP ===== */
function closePopup(){

document.getElementById("tutorialPopup")
.classList.remove("show");

document.body.classList.remove("lock");

document.body.classList.add("unlock");

/* MUSIC START */
if(!musicStarted){

musicStarted=true;

document.getElementById("audio")
.play()
.catch(()=>{});

}

}

/* ===== PHOTOS ===== */
const photos = [
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619885/foto1_i3ftiq.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619886/foto2_zw5y2d.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619897/foto3_lb3fhr.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619914/foto4_nsx0sm.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619929/foto5_nvduvv.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619936/foto7_wubv4o.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619937/foto8_sntkaq.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619897/foto28_tp9i71.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619884/foto11_hl6mqd.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619884/foto12_yrhhkp.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619884/foto13_p7kydj.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619884/foto15_w3xsnm.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619887/foto19_zn9oxc.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619913/foto38_qngn3j.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619915/foto41_phzjde.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619920/foto42_la9qwp.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619921/foto43_kcfq2e.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619923/foto46_jvrx6b.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619924/foto47_dbkpqz.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619930/foto52_cvenmq.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619908/foto34_errnoe.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619908/foto35_nfvzkq.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619909/foto36_ncdamp.jpg",
"https://res.cloudinary.com/dlzivwcxc/image/upload/v1778619884/foto10_j7kkzs.jpg",
];

const grid=document.getElementById("grid");

photos.forEach((src,i)=>{

const img=document.createElement("img");

img.src=src;

img.onclick=()=>openViewer(i);

grid.appendChild(img);

});

/* ===== OPEN VIEWER ===== */
function openViewer(i){

const viewer=document.getElementById("viewer");
const img=document.getElementById("img");
const downloadBtn=document.getElementById("downloadBtn");

img.src=photos[i];

downloadBtn.onclick=()=>{

const a=document.createElement("a");

a.href=photos[i];
a.download="photo.jpg";

a.click();

};

viewer.classList.add("active");

setTimeout(()=>{
viewer.classList.add("show");
},10);

}

function closeViewer(e){

if(e.target.id==="viewer"){

const viewer=document.getElementById("viewer");

viewer.classList.remove("show");

setTimeout(()=>{
viewer.classList.remove("active");
},250);

}

}

/* ===== MUSIC ===== */
const audio=document.getElementById("audio");
const btn=document.getElementById("btn");

let play=false;

function toggleMusic(){

if(!play){

audio.play();

btn.innerText="❚❚";

play=true;

}else{

audio.pause();

btn.innerText="▶";

play=false;

}

}

/* ===== PARTICLES ===== */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");

let w,h;

function resize(){

w=canvas.width=window.innerWidth;
h=canvas.height=window.innerHeight;

}

resize();

window.addEventListener("resize",resize);

const particles=[];

for(let i=0;i<40;i++){

particles.push({
x:Math.random()*w,
y:Math.random()*h,
r:Math.random()*3+1,
vx:(Math.random()-0.5)*0.3,
vy:(Math.random()-0.5)*0.3
});

}

function animate(){

ctx.clearRect(0,0,w,h);

for(let p of particles){

p.x+=p.vx;
p.y+=p.vy;

if(p.x<0)p.x=w;
if(p.x>w)p.x=0;
if(p.y<0)p.y=h;
if(p.y>h)p.y=0;

ctx.beginPath();

ctx.fillStyle="rgba(0,0,0,0.35)";

ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

ctx.fill();

}

requestAnimationFrame(animate);

}

animate();

</script>

</body>
</html>
