<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading ALBUM BoiBoy</title>

<style>

/* ===== BASE ===== */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui;
}

body{
background:black;
overflow:hidden;
color:white;
}

/* ===== CENTER WRAPPER ===== */
.container{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:18px;
}

/* ===== TITLE (GLASS GLOW STYLE) ===== */
h1{
font-size:28px;
letter-spacing:2px;
font-weight:800;
background:linear-gradient(90deg,#fff,#888);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:fadeIn 1.2s ease;
}

/* ===== SUB TEXT ===== */
#text{
font-size:13px;
opacity:0.6;
letter-spacing:1px;
}

/* ===== PROGRESS BAR ===== */
.bar{
width:240px;
height:5px;
background:rgba(255,255,255,0.08);
border-radius:999px;
overflow:hidden;
position:relative;
}

/* glow layer */
.bar::before{
content:"";
position:absolute;
inset:-2px;
background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);
animation:shine 1.5s infinite linear;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#fff,#aaa);
border-radius:999px;
transition:width 0.15s;
}

/* ===== DOT ANIMATION ===== */
.dots{
display:flex;
gap:4px;
margin-top:6px;
}

.dot{
width:5px;
height:5px;
background:white;
border-radius:50%;
opacity:0.2;
animation:blink 1s infinite;
}

.dot:nth-child(2){animation-delay:0.2s;}
.dot:nth-child(3){animation-delay:0.4s;}

@keyframes blink{
0%,100%{opacity:0.2; transform:scale(1);}
50%{opacity:1; transform:scale(1.3);}
}

/* ===== ANIMATIONS ===== */
@keyframes shine{
0%{transform:translateX(-100%);}
100%{transform:translateX(100%);}
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(8px);}
to{opacity:1; transform:translateY(0);}
}

/* ===== FOOT NOTE ===== */
small{
opacity:0.4;
font-size:11px;
letter-spacing:1px;
margin-top:8px;
}

</style>
</head>

<body>

<div class="container">

<h1>Loading Sabar Yah</h1>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div id="text">Booting system...</div>

<div class="dots">
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

<small>initializing assets</small>

</div>

<script>

let progress = 0;
const fill = document.getElementById("fill");
const text = document.getElementById("text");

const messages = [
"Booting system...",
"Loading interface...",
"Preparing gallery...",
"Optimizing assets...",
"Starting session..."
];

let i = 0;

/* ===== SMOOTH FAKE LOADER ===== */
const interval = setInterval(()=>{

progress += Math.random()*7;
if(progress > 100) progress = 100;

fill.style.width = progress + "%";

/* message shift */
if(progress > (i+1)*20 && i < messages.length-1){
i++;
text.innerText = messages[i];
}

/* DONE */
if(progress >= 100){
clearInterval(interval);

text.innerText = "Ready";

setTimeout(()=>{
window.location.href="home.html";
},500);
}

},160);

</script>

</body>
</html>
